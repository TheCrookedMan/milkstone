<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MILK / 纸面面板</title>
<meta name="theme-color" content="#e9eaee"><script>try{const mode=localStorage.getItem('milk-design-theme')==='dark'?'dark':'light';document.documentElement.dataset.theme=mode;document.documentElement.style.colorScheme=mode;document.querySelector('meta[name=theme-color]')?.setAttribute('content',mode==='dark'?'#1c1f24':'#e9eaee')}catch{}</script></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
