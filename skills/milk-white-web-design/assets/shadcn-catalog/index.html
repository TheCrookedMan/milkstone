<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#e9eaee"><title>MILK / 纸面组件集</title><script>try{const saved=localStorage.getItem('milk-design-theme');const mode=['light','dark','milk'].includes(saved)?saved:'light';document.documentElement.dataset.theme=mode;document.documentElement.style.colorScheme=mode==='dark'?'dark':'light';document.querySelector('meta[name=theme-color]')?.setAttribute('content',({light:'#e9eaee',dark:'#1c1f24',milk:'#f4f1ea'})[mode])}catch{}</script><script>document.documentElement.dataset.material='solid';try{if(localStorage.getItem('milk-design-material')==='glass')document.documentElement.dataset.material='glass'}catch{}</script></head><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
