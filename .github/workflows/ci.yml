name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/validate-skill.mjs
      - run: python3 scripts/verify-distribution.py
      - run: pnpm exec vue-tsc --noEmit -p skills/milk-white-web-design/assets/shadcn-catalog/tsconfig.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: milkstone-agent-skill
          if-no-files-found: error
          path: |
            public/milk-white-web-design.skill
            public/milk-white-web-design.skill.zip
            public/milk-white-web-design.tar.gz
